# Weekly digest of failed CI runs on main across the huishouden org. GitHub already emails whoever
# pushed a failing commit; this catches what slipped by (scheduled runs, bot pushes, a missed email).
# Opens one issue, assigned (so emailed) to the maintainer, only when something failed.
name: ci-digest

on:
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Collect failed runs on main from the last 7 days
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          since=$(date -u -d '7 days ago' +%Y-%m-%d)
          : > failures.md
          for repo in $(gh api "orgs/$ORG/repos?type=public&per_page=100" --paginate --jq '.[] | select(.archived | not) | .name'); do
            gh api "repos/$ORG/$repo/actions/runs?branch=main&status=failure&created=>=$since&per_page=50" \
              --jq ".workflow_runs[] | \"| $repo | \(.name) | \(.event) | \(.created_at[:10]) | [run](\(.html_url)) |\"" >> failures.md || true
          done
          echo "count=$(wc -l < failures.md | tr -d ' ')" >> "$GITHUB_ENV"
          echo "since=$since" >> "$GITHUB_ENV"
      - name: Open the digest issue
        if: env.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ASSIGNEE: piekstra # an assignment is emailed, whatever the watch settings
        run: |
          {
            echo "$count failed run(s) on \`main\` since $since."
            echo
            echo "| Repo | Workflow | Trigger | Date | Run |"
            echo "|---|---|---|---|---|"
            cat failures.md
            echo
            echo "Close this issue once each is fixed or explained."
          } > body.md
          gh issue create --repo "$REPO" --assignee "$ASSIGNEE" --title "CI digest: $count failed run(s) on main since $since" --body-file body.md
